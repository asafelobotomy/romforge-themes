# Every theme checked as romforge checks it before installing, and
# themes.json up to date (`romforge-cli themes index . --check`), and
# tools/audit.py's checks (colours, unused files, outranked card rules),
# and the README's themes up to date (tools/readme.py --check).
name: Check themes
on: [push, pull_request]
# Read-only token: these jobs only build and test.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: romforge's main
        id: romforge
        run: echo "sha=$(git ls-remote https://github.com/asafelobotomy/romforge refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cli
        with:
          path: ~/.cargo/bin/romforge-cli
          key: romforge-cli-${{ steps.romforge.outputs.sha }}
      - if: steps.cli.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - if: steps.cli.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/asafelobotomy/romforge --rev ${{ steps.romforge.outputs.sha }} romforge-cli --locked
      - run: romforge-cli themes index . --check
      - run: python3 tools/audit.py .
      - run: python3 tools/readme.py . --check
